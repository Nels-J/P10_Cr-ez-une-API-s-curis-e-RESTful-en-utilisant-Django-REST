<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SoftDesk API</title>
    <style>
        :root {
            --drf-blue: #2196f3;
            --drf-blue-dark: #1976d2;
            --bg: #f5f5f5;
            --text: #333;
            --muted: #666;
            --card-border: #ddd;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
        }

        .topbar {
            background: var(--drf-blue);
            color: #fff;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            font-weight: 600;
        }

        .container {
            max-width: 980px;
            margin: 1.25rem auto;
            padding: 0 1rem;
        }

        .card {
            background: #fff;
            border: 1px solid var(--card-border);
            border-radius: 4px;
            padding: 1.25rem;
        }

        h1 {
            margin: 0 0 0.5rem;
            font-size: 1.6rem;
            font-weight: 500;
        }

        p {
            margin: 0 0 1rem;
            color: var(--muted);
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .btn {
            display: inline-block;
            padding: 0.55rem 0.9rem;
            border-radius: 4px;
            text-decoration: none;
            font-size: 0.95rem;
            border: 1px solid var(--drf-blue);
            color: var(--drf-blue);
            background: #fff;
        }

        .btn:hover,
        .btn:focus {
            color: #fff;
            background: var(--drf-blue-dark);
            border-color: var(--drf-blue-dark);
        }
    </style>
</head>
<body>
    <header class="topbar">SoftDesk API</header>
    <main class="container">
        <section class="card">
            <h1>Bienvenue sur l'API SoftDesk</h1>
            <p>Acces rapide aux interfaces principales du projet.</p>
            <nav aria-label="Liens principaux">
                <a class="btn" href="/admin/">Django Admin</a>
                <a class="btn" href="/api/schema/swagger-ui/">Swagger UI</a>
                <a class="btn" href="/api/schema/redoc/">ReDoc</a>
            </nav>
        </section>
    </main>
</body>
</html>
